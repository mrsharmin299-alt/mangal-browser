name: Build Mangal Browser
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files into Android project
        run: |
          mkdir -p android/app/src/main/java/com/mangal/browser android/app/src/main/assets/web
          cp AndroidManifest.xml android/app/src/main/
          cp MainActivity.kt android/app/src/main/java/com/mangal/browser/
          cp index.html app.js style.css icons.js firebase-config.js android/app/src/main/assets/web/
          cat > build.gradle <<'EOT'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOT
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'MangalBrowser'
          include ':app'
          project(':app').projectDir = file('android/app')
          EOT
          cat > android/app/build.gradle <<'EOT'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.mangal.browser'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mangal.browser'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mangal-browser-apk
          path: android/app/build/outputs/apk/debug/*.apk
