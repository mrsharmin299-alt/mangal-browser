name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Arrange project files
        run: |
          set -e
          P=proj
          mkdir -p $P/app/src/main/java/com/mangal/browser $P/app/src/main/assets/web
          pick() { find . \( -path ./$P -o -path ./.git \) -prune -o -type f -name "$1" -print | head -n 1; }
          cp "$(pick MainActivity.kt)" $P/app/src/main/java/com/mangal/browser/
          cp "$(pick AndroidManifest.xml)" $P/app/src/main/
          for f in index.html app.js style.css icons.js firebase-config.js; do
            cp "$(pick $f)" $P/app/src/main/assets/web/
          done
          cat > $P/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://maven.mozilla.org/maven2/" }
              }
          }
          rootProject.name = 'MangalBrowser'
          include ':app'
          EOF
          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF
          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.mangal.browser'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mangal.browser'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
                  ndk { abiFilters 'arm64-v8a' }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'org.mozilla.geckoview:geckoview:[130.0,137.0)'
          }
          EOF
          if [ -n "$(pick ic_launcher.png)" ] && [ -n "$(pick ic_launcher_foreground.png)" ]; then
            R=$P/app/src/main/res
            mkdir -p $R/mipmap-nodpi $R/mipmap-anydpi-v26 $R/values
            cp "$(pick ic_launcher.png)" $R/mipmap-nodpi/ic_launcher.png
            cp "$(pick ic_launcher_foreground.png)" $R/mipmap-nodpi/ic_launcher_foreground.png
            cat > $R/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#030102</color></resources>
          EOF
            cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
            sed -i 's|<application|<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"|' $P/app/src/main/AndroidManifest.xml
          fi
      - name: Patch manifest (permissions, rotation, http sites)
        run: |
          python3 - <<'PY' || echo "manifest patch skipped"
          import re
          p = 'proj/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['INTERNET', 'ACCESS_NETWORK_STATE', 'ACCESS_FINE_LOCATION',
                   'ACCESS_COARSE_LOCATION', 'CAMERA', 'RECORD_AUDIO']
          add = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x
                        for x in perms if ('android.permission.%s"' % x) not in s)
          if add:
              s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + '\n' + add, s, count=1)
          attrs = ''
          if 'configChanges' not in s:
              attrs += ' android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"'
          if 'launchMode' not in s:
              attrs += ' android:launchMode="singleTask"'
          if 'supportsPictureInPicture' not in s:
              attrs += ' android:supportsPictureInPicture="true"'
          if 'windowSoftInputMode' not in s:
              attrs += ' android:windowSoftInputMode="adjustResize"'
          if attrs:
              s = s.replace('<activity', '<activity' + attrs, 1)
          if 'android:scheme="https"' not in s:
              filt = ('<intent-filter>'
                      '<action android:name="android.intent.action.VIEW"/>'
                      '<category android:name="android.intent.category.DEFAULT"/>'
                      '<category android:name="android.intent.category.BROWSABLE"/>'
                      '<data android:scheme="http"/><data android:scheme="https"/>'
                      '</intent-filter>')
              s = s.replace('</activity>', filt + '</activity>', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY
      - name: Build debug APK
        working-directory: proj
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mangal-browser-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk
