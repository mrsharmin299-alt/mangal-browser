name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Arrange project files
        run: |
          set -e
          P=proj
          mkdir -p $P/app/src/main/java/com/mangal/browser $P/app/src/main/assets/web
          pick() { find . \( -path ./$P -o -path ./.git \) -prune -o -type f -name "$1" -print | head -n 1; }
          cp "$(pick MainActivity.kt)" $P/app/src/main/java/com/mangal/browser/
          cp "$(pick AndroidManifest.xml)" $P/app/src/main/
          for f in index.html app.js style.css icons.js firebase-config.js; do
            cp "$(pick $f)" $P/app/src/main/assets/web/
          done
          cat > $P/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://maven.mozilla.org/maven2/" }
              }
          }
          rootProject.name = 'MangalBrowser'
          include ':app'
          EOF
          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF
          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.mangal.browser'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mangal.browser'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
                  ndk { abiFilters 'arm64-v8a' }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'org.mozilla.geckoview:geckoview:[130.0,137.0)'
          }
          EOF
      - name: Build debug APK
        working-directory: proj
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mangal-browser-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk
