name: Build Mangal Browser
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q ./*.zip -d src
          D=$(dirname "$(find src -name settings.gradle | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mangal-browser-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/*.apk
